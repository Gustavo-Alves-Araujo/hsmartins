<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - HS Martins</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">
    <div id="app"></div>

    <script>
        // Configuração do Supabase
        const SUPABASE_URL = 'https://vkwczizdjhsejbpaapea.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrd2N6aXpkamhzZWpicGFhcGVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4NDU0MzAsImV4cCI6MjA4MzQyMTQzMH0.qvWHxNAhefq253JaoVYG19izClKgLGc4ZkW5y8ladmM';
        
        // Aguarda o Supabase carregar antes de criar o cliente
        let supabaseClient;
        
        // Inicializa o Supabase quando a biblioteca estiver pronta
        function initSupabase() {
            if (typeof supabase !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return true;
            }
            return false;
        }

        // Estado da aplicação
        let isAuthenticated = false;
        let products = [];
        let editingProduct = null;
        let uploadedImagesUrls = []; // Array para armazenar URLs das imagens
        let noticias = [];
        let editingNoticia = null;
        let currentTab = 'imoveis'; // 'imoveis' ou 'noticias'

        // Máscara de preço em Real
        function formatPriceInput(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length === 0) {
                input.value = '';
                return;
            }
            
            value = (parseInt(value) / 100).toFixed(2);
            value = value.replace('.', ',');
            value = value.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            input.value = 'R$ ' + value;
        }

        // Remove formatação do preço para salvar
        function unformatPrice(priceStr) {
            if (!priceStr) return null;
            return priceStr.replace(/[^\d,]/g, '').replace(',', '.');
        }

        // Aplica máscara aos campos de preço
        function initPriceMasks() {
            const priceInputs = ['product-price-current', 'product-price-original'];
            priceInputs.forEach(id => {
                const input = document.getElementById(id);
                if (input) {
                    input.addEventListener('input', function() {
                        formatPriceInput(this);
                    });
                }
            });
        }

        // Verifica autenticação ao carregar
        function checkAuth() {
            const authToken = localStorage.getItem('admin_auth');
            if (authToken === '123123') {
                isAuthenticated = true;
                loadProducts();
                loadNoticias();
                renderDashboard();
            } else {
                renderLogin();
            }
        }

        // Renderiza tela de login
        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen flex items-center justify-center px-4">
                    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
                        <div class="text-center mb-8">
                            <h1 class="text-3xl font-bold text-gray-900">Admin HS Martins</h1>
                            <p class="text-gray-600 mt-2">Gerenciamento de Imóveis</p>
                        </div>
                        
                        <form onsubmit="handleLogin(event)" class="space-y-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
                                <input 
                                    type="password" 
                                    id="password" 
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="Digite a senha"
                                    required
                                >
                            </div>
                            
                            <button 
                                type="submit"
                                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                            >
                                <i class="fas fa-sign-in-alt mr-2"></i>
                                Entrar
                            </button>
                        </form>
                        
                        <div id="login-error" class="mt-4 text-red-600 text-sm text-center hidden"></div>
                    </div>
                </div>
            `;
        }

        // Handler de login
        function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            
            if (password === '123123') {
                localStorage.setItem('admin_auth', password);
                isAuthenticated = true;
                loadProducts();
                loadNoticias();
                renderDashboard();
            } else {
                errorDiv.textContent = 'Senha incorreta!';
                errorDiv.classList.remove('hidden');
            }
        }

        // Logout
        function handleLogout() {
            localStorage.removeItem('admin_auth');
            isAuthenticated = false;
            renderLogin();
        }

        // Carrega produtos do Supabase
        async function loadProducts() {
            try {
                // Inicializa o Supabase se ainda não foi inicializado
                if (!supabaseClient) {
                    initSupabase();
                }
                
                if (!supabaseClient) {
                    throw new Error('Supabase não foi inicializado');
                }
                
                const { data, error } = await supabaseClient
                    .from('Hsmartins_Produtos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                products = data || [];
                
                // Verifica se modal está aberto antes de renderizar
                const productModal = document.getElementById('product-modal');
                const noticiaModal = document.getElementById('noticia-modal');
                const productModalOpen = productModal && !productModal.classList.contains('hidden');
                const noticiaModalOpen = noticiaModal && !noticiaModal.classList.contains('hidden');
                
                if (productModalOpen || noticiaModalOpen) {
                    // Se modal está aberto, apenas atualiza o conteúdo
                    updateDashboardContent();
                } else {
                    // Se modal está fechado, renderiza normalmente
                    renderDashboard();
                }
            } catch (error) {
                console.error('Erro ao carregar produtos:', error);
                alert('Erro ao carregar produtos. Verifique se a tabela existe no Supabase.');
            }
        }

        // Renderiza dashboard
        function renderDashboard() {
            if (!isAuthenticated) return;

            // Não recria o dashboard se um modal estiver aberto
            const productModal = document.getElementById('product-modal');
            const noticiaModal = document.getElementById('noticia-modal');
            const productModalOpen = productModal && !productModal.classList.contains('hidden');
            const noticiaModalOpen = noticiaModal && !noticiaModal.classList.contains('hidden');
            
            if (productModalOpen || noticiaModalOpen) {
                // Apenas atualiza o conteúdo sem recriar tudo
                updateDashboardContent();
                return;
            }

            const appEl = document.getElementById('app');
            appEl.innerHTML = `
                <div class="min-h-screen bg-gray-50">
                    <!-- Header -->
                    <header class="bg-white shadow-sm">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h1 class="text-2xl font-bold text-gray-900">Admin - HS Martins</h1>
                                    <p class="text-sm text-gray-600">Gerenciamento de Imóveis</p>
                                </div>
                                <button 
                                    onclick="handleLogout()"
                                    class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition"
                                >
                                    <i class="fas fa-sign-out-alt mr-2"></i>
                                    Sair
                                </button>
                            </div>
                        </div>
                    </header>

                    <!-- Main Content -->
                    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <!-- Tabs -->
                        <div class="mb-6 border-b border-gray-200">
                            <nav class="flex gap-4">
                                <button 
                                    onclick="switchTab('imoveis')"
                                    class="px-4 py-2 font-semibold border-b-2 transition ${currentTab === 'imoveis' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-600 hover:text-gray-900'}"
                                >
                                    <i class="fas fa-home mr-2"></i>
                                    Imóveis
                                </button>
                                <button 
                                    onclick="switchTab('noticias')"
                                    class="px-4 py-2 font-semibold border-b-2 transition ${currentTab === 'noticias' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-600 hover:text-gray-900'}"
                                >
                                    <i class="fas fa-newspaper mr-2"></i>
                                    Notícias
                                </button>
                            </nav>
                        </div>

                        <!-- Imóveis Tab -->
                        <div id="imoveis-tab" class="${currentTab === 'imoveis' ? '' : 'hidden'}">
                            <!-- Actions -->
                            <div class="mb-6 flex justify-between items-center">
                                <h2 class="text-xl font-semibold text-gray-900">Imóveis Cadastrados</h2>
                                <button 
                                    onclick="openProductModal()"
                                    class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                                >
                                    <i class="fas fa-plus mr-2"></i>
                                    Novo Imóvel
                                </button>
                            </div>

                            <!-- Products Grid -->
                            <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${products.length === 0 ? `
                                <div class="col-span-full text-center py-12">
                                    <i class="fas fa-home text-6xl text-gray-300 mb-4"></i>
                                    <p class="text-gray-600">Nenhum imóvel cadastrado ainda.</p>
                                    <button 
                                        onclick="openProductModal()"
                                        class="mt-4 text-blue-600 hover:text-blue-700 font-semibold"
                                    >
                                        Cadastrar primeiro imóvel
                                    </button>
                                </div>
                            ` : products.map(product => `
                                <div class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-md transition">
                                    <div class="aspect-[4/3] bg-gray-200 relative">
                                        ${product.image_url ? `
                                            <img src="${product.image_url}" alt="${product.title}" class="w-full h-full object-cover">
                                        ` : `
                                            <div class="w-full h-full flex items-center justify-center">
                                                <i class="fas fa-image text-4xl text-gray-400"></i>
                                            </div>
                                        `}
                                        ${product.badge_text ? `
                                            <span class="absolute top-3 left-3 ${product.badge_style === 'new' ? 'bg-gray-900' : 'bg-red-500'} text-white text-xs font-bold px-2 py-1 rounded">
                                                ${product.badge_text}
                                            </span>
                                        ` : ''}
                                    </div>
                                    <div class="p-4">
                                        <p class="text-sm text-gray-500 mb-1">${product.category || ''}</p>
                                        <h3 class="font-semibold text-lg mb-2">${product.title}</h3>
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="text-lg font-bold text-gray-900">${product.price_current}</span>
                                            ${product.price_original ? `<span class="text-sm text-gray-400 line-through">${product.price_original}</span>` : ''}
                                        </div>
                                        <div class="flex items-center justify-between text-sm text-gray-600 mb-4">
                                            <span><i class="fas fa-star text-yellow-400"></i> ${product.rating || 'N/A'}</span>
                                            <span>${product.installments || ''}</span>
                                        </div>
                                        <div class="flex gap-2">
                                            <button 
                                                onclick='editProduct(${JSON.stringify(product).replace(/'/g, "&apos;")})'
                                                class="flex-1 bg-blue-50 text-blue-600 py-2 rounded-lg font-semibold hover:bg-blue-100 transition"
                                            >
                                                <i class="fas fa-edit"></i> Editar
                                            </button>
                                            <button 
                                                onclick="deleteProduct('${product.id}')"
                                                class="flex-1 bg-red-50 text-red-600 py-2 rounded-lg font-semibold hover:bg-red-100 transition"
                                            >
                                                <i class="fas fa-trash"></i> Excluir
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                            </div>
                        </div>

                        <!-- Notícias Tab -->
                        <div id="noticias-tab" class="${currentTab === 'noticias' ? '' : 'hidden'}">
                            <!-- Actions -->
                            <div class="mb-6 flex justify-between items-center">
                                <h2 class="text-xl font-semibold text-gray-900">Notícias Cadastradas</h2>
                                <button 
                                    onclick="openNoticiaModal()"
                                    class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                                >
                                    <i class="fas fa-plus mr-2"></i>
                                    Nova Notícia
                                </button>
                            </div>

                            <!-- Noticias Grid -->
                            <div id="noticias-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                ${noticias.length === 0 ? `
                                    <div class="col-span-full text-center py-12">
                                        <i class="fas fa-newspaper text-6xl text-gray-300 mb-4"></i>
                                        <p class="text-gray-600">Nenhuma notícia cadastrada ainda.</p>
                                        <button 
                                            onclick="openNoticiaModal()"
                                            class="mt-4 text-blue-600 hover:text-blue-700 font-semibold"
                                        >
                                            Cadastrar primeira notícia
                                        </button>
                                    </div>
                                ` : noticias.map(noticia => `
                                    <div class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-md transition">
                                        <div class="aspect-video bg-gray-200 relative">
                                            ${noticia.imagem_principal ? `
                                                <img src="${noticia.imagem_principal}" alt="${noticia.titulo}" class="w-full h-full object-cover">
                                            ` : `
                                                <div class="w-full h-full flex items-center justify-center">
                                                    <i class="fas fa-image text-4xl text-gray-400"></i>
                                                </div>
                                            `}
                                            ${noticia.destacado ? `
                                                <span class="absolute top-3 left-3 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded">
                                                    Destaque
                                                </span>
                                            ` : ''}
                                            <span class="absolute top-3 right-3 bg-white/90 text-gray-900 text-xs font-semibold px-2 py-1 rounded">
                                                ${noticia.status || 'rascunho'}
                                            </span>
                                        </div>
                                        <div class="p-4">
                                            <p class="text-sm text-gray-500 mb-1">${noticia.categoria || 'Geral'}</p>
                                            <h3 class="font-semibold text-lg mb-2 line-clamp-2">${noticia.titulo}</h3>
                                            <p class="text-sm text-gray-600 mb-4 line-clamp-2">${noticia.resumo || ''}</p>
                                            <div class="flex items-center justify-between text-xs text-gray-500 mb-4">
                                                <span><i class="far fa-calendar"></i> ${formatDateAdmin(noticia.data_publicacao)}</span>
                                                <span><i class="far fa-user"></i> ${noticia.autor || 'H.S Martins'}</span>
                                            </div>
                                            <div class="flex gap-2">
                                                <button 
                                                    onclick="editNoticiaById('${noticia.id}')"
                                                    class="flex-1 bg-blue-50 text-blue-600 py-2 rounded-lg font-semibold hover:bg-blue-100 transition"
                                                >
                                                    <i class="fas fa-edit"></i> Editar
                                                </button>
                                                <button 
                                                    onclick="deleteNoticia('${noticia.id}')"
                                                    class="flex-1 bg-red-50 text-red-600 py-2 rounded-lg font-semibold hover:bg-red-100 transition"
                                                >
                                                    <i class="fas fa-trash"></i> Excluir
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </main>
                </div>

                <!-- Modal -->
                <div id="product-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onclick="if(event.target === this) closeProductModal()">
                    <div class="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
                        <div class="p-6">
                            <div class="flex justify-between items-center mb-6">
                                <h2 class="text-2xl font-bold text-gray-900">
                                    <span id="modal-title">Novo Imóvel</span>
                                </h2>
                                <button onclick="closeProductModal()" class="text-gray-400 hover:text-gray-600">
                                    <i class="fas fa-times text-xl"></i>
                                </button>
                            </div>

                            <form id="product-form" onsubmit="handleProductSubmit(event)" class="space-y-6">
                                <input type="hidden" id="product-id">
                                
                                <!-- Tabs de Navegação -->
                                <div class="border-b border-gray-200 mb-6">
                                    <nav class="flex space-x-4 overflow-x-auto" id="form-tabs">
                                        <button type="button" onclick="switchTab('basico')" class="tab-btn active px-4 py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600 whitespace-nowrap">
                                            Básico
                                        </button>
                                        <button type="button" onclick="switchTab('caracteristicas')" class="tab-btn px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap">
                                            Características
                                        </button>
                                        <button type="button" onclick="switchTab('valores')" class="tab-btn px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap">
                                            Valores
                                        </button>
                                        <button type="button" onclick="switchTab('endereco')" class="tab-btn px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap">
                                            Endereço
                                        </button>
                                        <button type="button" onclick="switchTab('empreendimento')" class="tab-btn px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap">
                                            Empreendimento
                                        </button>
                                        <button type="button" onclick="switchTab('midia')" class="tab-btn px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap">
                                            Mídia
                                        </button>
                                        <button type="button" onclick="switchTab('status')" class="tab-btn px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap">
                                            Status
                                        </button>
                                    </nav>
                                </div>

                                <!-- Tab: Básico -->
                                <div id="tab-basico" class="tab-content space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Título *</label>
                                    <input type="text" id="product-title" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                </div>

                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Referência (Ref)</label>
                                            <input type="text" id="product-ref" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Old ID</label>
                                            <input type="number" id="product-old-id" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-3 gap-4">
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Imóvel</label>
                                            <select id="product-tipoimovel" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                                <option value="">Selecione</option>
                                                <option value="Apartamento">Apartamento</option>
                                                <option value="Casa">Casa</option>
                                                <option value="Sobrado">Sobrado</option>
                                                <option value="Terreno">Terreno</option>
                                                <option value="Chácara">Chácara</option>
                                                <option value="Sala Comercial">Sala Comercial</option>
                                                <option value="Loja">Loja</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Subtipo</label>
                                            <input type="text" id="product-subtipoimovel" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Transação</label>
                                            <select id="product-transacao" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                                <option value="">Selecione</option>
                                                <option value="Venda">Venda</option>
                                                <option value="Aluguel">Aluguel</option>
                                            </select>
                                        </div>
                                    </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Categoria</label>
                                    <input type="text" id="product-category" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                </div>

                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
                                        <textarea id="product-descricao" rows="6" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Descrição completa do imóvel..."></textarea>
                                    </div>
                                </div>

                                <!-- Tab: Características -->
                                <div id="tab-caracteristicas" class="tab-content hidden space-y-4">
                                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Dormitórios</label>
                                            <input type="number" id="product-dormitorios" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Banheiros</label>
                                            <input type="number" id="product-banheiro" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Suítes</label>
                                            <input type="number" id="product-suites" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Vagas</label>
                                            <input type="number" id="product-vagas" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Área Construída (m²)</label>
                                            <input type="number" id="product-area-construida" step="0.01" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Área do Terreno (m²)</label>
                                            <input type="number" id="product-area-terreno" step="0.01" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">

        // Atualiza apenas o conteúdo do dashboard sem recriar modais
        function updateDashboardContent() {
            if (!isAuthenticated) return;
            
            // Atualiza apenas os grids de produtos e notícias
            const productsGrid = document.getElementById('products-grid');
            const newsGrid = document.getElementById('news-grid');
            
            if (productsGrid && currentTab === 'imoveis') {
                productsGrid.innerHTML = products.length === 0 ? `
                    <div class="col-span-full text-center py-12">
                        <i class="fas fa-home text-6xl text-gray-300 mb-4"></i>

                        <button onclick="openProductModal()" class="mt-4 text-blue-600 hover:text-blue-700 font-semibold">

                ` : products.map(product => `
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-md transition">
                        <div class="aspect-[4/3] bg-gray-200 relative">
                            ${product.image_url ? `<img src="${product.image_url}" alt="${product.title}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center"><i class="fas fa-image text-4xl text-gray-400"></i></div>`}

                        <div class="p-4">

        // Abre modal de produto
        function openProductModal(product = null) {
            editingProduct = product;
            uploadedImagesUrls = []; // Limpa URLs temporárias
            const modal = document.getElementById('product-modal');
            const modalTitle = document.getElementById('modal-title');
            
            if (product) {
                modalTitle.textContent = 'Editar Imóvel';
                
                // Identificação
                document.getElementById('product-id').value = product.id || '';
                document.getElementById('product-ref').value = product.ref || '';
                document.getElementById('product-old-id').value = product.old_id || '';
                
                // Básico
                document.getElementById('product-title').value = product.title || '';
                document.getElementById('product-tipoimovel').value = product.tipoimovel || '';
                document.getElementById('product-subtipoimovel').value = product.subtipoimovel || '';
                document.getElementById('product-transacao').value = product.transacao || '';
                document.getElementById('product-category').value = product.category || '';
                document.getElementById('product-descricao').value = product.descricao || '';
                
                // Características
                document.getElementById('product-dormitorios').value = product.dormitorios || '';
                document.getElementById('product-banheiro').value = product.banheiro || '';
                document.getElementById('product-suites').value = product.suites || '';
                document.getElementById('product-vagas').value = product.vagas || '';
                document.getElementById('product-area-construida').value = product.area_construida || '';
                document.getElementById('product-area-terreno').value = product.area_terreno || '';
                document.getElementById('product-area-privativa').value = product.area_privativa || '';
                document.getElementById('product-area-total').value = product.area_total || '';
                document.getElementById('product-mobiliado').checked = product.mobiliado === true || product.mobiliado === 'true' || product.mobiliado === 1;
                document.getElementById('product-em-condominio').checked = product.em_condominio === true || product.em_condominio === 'true' || product.em_condominio === 1;
                document.getElementById('product-aceita-financiamento').checked = product.aceitafinanciamento === true || product.aceitafinanciamento === 'true' || product.aceitafinanciamento === 1;
                document.getElementById('product-ano-construcao').value = product.ano_construcao || '';
                
                // Características (array)
                if (product.caracteristicas) {
                    const chars = Array.isArray(product.caracteristicas) ? product.caracteristicas : JSON.parse(product.caracteristicas || '[]');
                    document.getElementById('product-characteristics').value = chars.join('\n');
                } else {
                    document.getElementById('product-characteristics').value = '';
                }
                
                // Valores
                document.getElementById('product-price-current').value = product.price_current || '';
                document.getElementById('product-price-original').value = product.price_original || '';
                document.getElementById('product-valor').value = product.valor || '';
                document.getElementById('product-valor-condominio').value = product.valor_condominio || '';
                document.getElementById('product-valor-iptu').value = product.valor_iptu || '';
                document.getElementById('product-installments').value = product.installments || '';
                
                // Endereço
                document.getElementById('product-endereco-logradouro').value = product.endereco_logradouro || '';
                document.getElementById('product-endereco-numero').value = product.endereco_numero || '';

        // Navegação entre abas do modal
        function switchTab(tabName) {
            // Verifica se é uma aba do dashboard (imoveis/noticias)
            if (tabName === 'imoveis' || tabName === 'noticias') {
                currentTab = tabName;
                renderDashboard();
                return;
            }
            
            // Se não é dashboard, é aba do modal
            const modal = document.getElementById('product-modal');
            if (!modal || modal.classList.contains('hidden')) {
                return; // Modal não está aberto
            }
            
            // Busca apenas dentro do modal
            const modalContent = modal.querySelector('.bg-white');
            if (!modalContent) return;
            
            // Esconde todas as abas do modal
            modalContent.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.add('hidden');
            });
            
            // Remove classe active de todos os botões do modal
            modalContent.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'border-blue-600', 'text-blue-600');
                btn.classList.add('text-gray-500');
            });
            
            // Mostra a aba selecionada
            const tabContent = modalContent.querySelector(`#tab-${tabName}`);
            if (tabContent) {
                tabContent.classList.remove('hidden');
            }
            
            // Ativa o botão correspondente
            modalContent.querySelectorAll('.tab-btn').forEach(btn => {
                const onclickAttr = btn.getAttribute('onclick');
                if (onclickAttr && onclickAttr.includes(`switchTab('${tabName}')`)) {
                    btn.classList.add('active', 'border-blue-600', 'text-blue-600');
                    btn.classList.remove('text-gray-500');
                }
            });
        }

        // Preview de múltiplas imagens
        function handleMultipleImagePreview(event) {
            const files = Array.from(event.target.files);
            const previewContainer = document.getElementById('images-preview');
            
            if (files.length > 20) {
                alert('Máximo de 20 imagens por imóvel!');
                event.target.value = '';
                return;
            }

            // Limpa preview anterior (mas mantém imagens já salvas)
            const existingCount = uploadedImagesUrls.length;
            if (existingCount + files.length > 20) {
                alert(`Você já tem ${existingCount} imagens. Pode adicionar no máximo ${20 - existingCount} novas.`);
                event.target.value = '';
                return;
            }

            previewContainer.innerHTML = '';
            
            // Mostra imagens existentes primeiro
            if (uploadedImagesUrls.length > 0) {
                displayExistingImages(uploadedImagesUrls);
            }
            
            // Adiciona preview das novas imagens
            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgDiv = document.createElement('div');
                    imgDiv.className = 'relative group';
                    imgDiv.innerHTML = `
                        <img src="${e.target.result}" class="w-full h-24 object-cover rounded-lg border-2 border-green-300">
                        <span class="absolute top-1 left-1 bg-green-500 text-white text-xs px-2 py-0.5 rounded">Nova</span>
                        ${existingCount === 0 && index === 0 ? '<span class="absolute bottom-1 left-1 bg-blue-500 text-white text-xs px-2 py-0.5 rounded">Principal</span>' : ''}
                    `;
                    previewContainer.appendChild(imgDiv);
                };
                reader.readAsDataURL(file);
            });
        }

        // Upload de múltiplas imagens para Supabase
        async function uploadMultipleImages(files) {
            try {
                if (!supabaseClient) {
                    initSupabase();
                }
                
                const uploadPromises = Array.from(files).map(async (file) => {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}-${Math.random().toString(36).substring(7)}.${fileExt}`;
                    const filePath = `produtos/${fileName}`;

                    const { data, error } = await supabaseClient.storage
                        .from('Hsmartins_Produtos')
                        .upload(filePath, file);

                    if (error) throw error;

                    const { data: urlData } = supabaseClient.storage
                        .from('Hsmartins_Produtos')
                        .getPublicUrl(filePath);

                    return urlData.publicUrl;
                });

                return await Promise.all(uploadPromises);
            } catch (error) {
                console.error('Erro ao fazer upload de imagens:', error);
                throw error;
            }
        }

        // Submete formulário de produto
        async function handleProductSubmit(event) {
            event.preventDefault();
            
            const submitBtn = event.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Salvando...';

            try {
                // Processa múltiplas imagens
                let allImagesUrls = [...uploadedImagesUrls]; // Começa com imagens já existentes
                const newImageFiles = document.getElementById('product-images').files;
                
                if (newImageFiles.length > 0) {
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Enviando imagens...';
                    const newUrls = await uploadMultipleImages(newImageFiles);
                    allImagesUrls = [...allImagesUrls, ...newUrls];
                }

                // Processa características (uma por linha -> array)
                const characteristicsText = document.getElementById('product-characteristics').value || '';
                const characteristics = characteristicsText
                    .split('\n')
                    .map(c => c.trim())
                    .filter(c => c.length > 0);

                // Helper para converter valores vazios em null
                const getValue = (id) => {
                    const el = document.getElementById(id);
                    return el && el.value ? el.value : null;
                };

                const getNumberValue = (id) => {
                    const el = document.getElementById(id);
                    return el && el.value ? parseFloat(el.value) : null;
                };

                const getIntValue = (id) => {
                    const el = document.getElementById(id);
                    return el && el.value ? parseInt(el.value) : null;
                };

                const getBoolValue = (id) => {
                    const el = document.getElementById(id);
                    return el ? el.checked : false;
                };

                const productData = {
                    // Identificação
                    ref: getValue('product-ref'),
                    old_id: getIntValue('product-old-id'),
                    
                    // Informações Básicas
                    title: document.getElementById('product-title').value,
                    tipoimovel: getValue('product-tipoimovel'),
                    subtipoimovel: getValue('product-subtipoimovel'),
                    transacao: getValue('product-transacao'),
                    category: getValue('product-category'),
                    descricao: getValue('product-descricao'),
                    
                    // Valores
                    valor: getNumberValue('product-valor'),
                    price_current: document.getElementById('product-price-current').value,
                    price_original: getValue('product-price-original'),
                    valor_condominio: getNumberValue('product-valor-condominio'),
                    valor_iptu: getNumberValue('product-valor-iptu'),
                    installments: getValue('product-installments'),
                    
                    // Áreas
                    area_privativa: getNumberValue('product-area-privativa'),
                    area_construida: getNumberValue('product-area-construida'),
                    area_total: getNumberValue('product-area-total'),
                    area_terreno: getNumberValue('product-area-terreno'),
                    
                    // Características do Imóvel
                    dormitorios: getIntValue('product-dormitorios'),
                    banheiro: getIntValue('product-banheiro'),
                    suites: getIntValue('product-suites'),
                    vagas: getIntValue('product-vagas'),
                    mobiliado: getBoolValue('product-mobiliado'),
                    em_condominio: getBoolValue('product-em-condominio'),
                    ano_construcao: getIntValue('product-ano-construcao'),
                    aceitafinanciamento: getBoolValue('product-aceita-financiamento'),
                    
                    // Endereço
                    endereco_logradouro: getValue('product-endereco-logradouro'),
                    endereco_numero: getValue('product-endereco-numero'),
                    endereco_complemento: getValue('product-endereco-complemento'),
                    endereco_cep: getValue('product-endereco-cep'),
                    endereco_bairro: getValue('product-endereco-bairro'),
                    endereco_nome_condominio: getValue('product-endereco-nome-condominio'),
                    endereco_zona: getValue('product-endereco-zona'),
                    endereco_regiao: getValue('product-endereco-regiao'),
                    endereco_pontoreferencia: getValue('product-endereco-pontoreferencia'),
                    endereco_cidade: getValue('product-endereco-cidade'),
                    endereco_estado: getValue('product-endereco-estado'),
                    endereco_pais: getValue('product-endereco-pais'),
                    
                    // Empreendimento
                    empreendimento_nome: getValue('product-empreendimento-nome'),
                    empreendimento_descricao: getValue('product-empreendimento-descricao'),
                    empreendimento_estagio: getValue('product-empreendimento-estagio'),
                    empreendimento_inicio: getValue('product-empreendimento-inicio') || null,
                    empreendimento_terminio: getValue('product-empreendimento-terminio') || null,
                    
                    // Mídia
                    video: getValue('product-video'),
                    image_url: allImagesUrls.length > 0 ? allImagesUrls[0] : null,
                    images_urls: JSON.stringify(allImagesUrls),
                    
                    // Características (array)
                    caracteristicas: JSON.stringify(characteristics),
                    
                    // Status e Controle
                    destacado: getBoolValue('product-destacado'),
                    imovel_status: getValue('product-imovel-status'),
                    imovel_situacao: getValue('product-imovel-situacao'),
                    badge_text: getValue('product-badge-text'),
                    badge_style: getValue('product-badge-style'),
                    rating: getValue('product-rating')
                };

                const productId = document.getElementById('product-id').value;

                if (productId) {
                    // Atualizar
                    const { error } = await supabaseClient
                        .from('Hsmartins_Produtos')
                        .update(productData)
                        .eq('id', productId);

                    if (error) throw error;
                } else {
                    // Criar
                    const { error } = await supabaseClient
                        .from('Hsmartins_Produtos')
                        .insert([productData]);

                    if (error) throw error;
                }

                closeProductModal();
                await loadProducts();
                alert('Imóvel salvo com sucesso!');
            } catch (error) {
                console.error('Erro ao salvar produto:', error);
                alert('Erro ao salvar imóvel: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-save mr-2"></i> Salvar';
            }
        }

        function generateSlug(text) {
            return text
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/(^-|-$)+/g, '');
        }

                document.getElementById('noticia-modal-title').textContent = 'Editar Notícia';
                document.getElementById('noticia-titulo').value = noticia.titulo || '';
                document.getElementById('noticia-slug').value = noticia.slug || '';
                document.getElementById('noticia-categoria').value = noticia.categoria || '';
                document.getElementById('noticia-autor').value = noticia.autor || 'H.S Martins';
                document.getElementById('noticia-status').value = noticia.status || 'rascunho';
                document.getElementById('noticia-destacado').checked = noticia.destacado || false;
                document.getElementById('noticia-resumo').value = noticia.resumo || '';
                document.getElementById('noticia-imagem').value = noticia.imagem_principal || '';
                document.getElementById('noticia-conteudo').value = noticia.conteudo || '';
                document.getElementById('noticia-meta-descricao').value = noticia.meta_descricao || '';
            } else {
                document.getElementById('noticia-modal-title').textContent = 'Nova Notícia';
                form.reset();
                document.getElementById('noticia-autor').value = 'H.S Martins';
                document.getElementById('noticia-status').value = 'rascunho';
            }

            // Gera slug automaticamente quando título muda
            document.getElementById('noticia-titulo').addEventListener('input', function() {
                const slugInput = document.getElementById('noticia-slug');
                if (!slugInput.value || slugInput.dataset.autoGenerated === 'true') {
                    slugInput.value = generateSlug(this.value);
                    slugInput.dataset.autoGenerated = 'true';
                }
            });

            const noticiaModalEl = document.getElementById('noticia-modal');
            if (noticiaModalEl) {
                noticiaModalEl.classList.remove('hidden');
            }
        }

        // Fecha modal de notícia
        function closeNoticiaModal() {
            const noticiaModalEl = document.getElementById('noticia-modal');
            if (noticiaModalEl) {
                noticiaModalEl.classList.add('hidden');
            }
            editingNoticia = null;
        }

        // Salva notícia
        async function handleNoticiaSubmit(event) {
            event.preventDefault();
            const submitBtn = event.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Salvando...';

            try {
                if (!supabaseClient) {
                    initSupabase();
                }

                const titulo = document.getElementById('noticia-titulo').value;
                let slug = document.getElementById('noticia-slug').value.trim();
                if (!slug) {
                    slug = generateSlug(titulo);
                }

                const noticiaData = {
                    titulo: titulo,
                    slug: slug,
                    categoria: document.getElementById('noticia-categoria').value || null,
                    autor: document.getElementById('noticia-autor').value || 'H.S Martins',
                    status: document.getElementById('noticia-status').value,
                    destacado: document.getElementById('noticia-destacado').checked,
                    resumo: document.getElementById('noticia-resumo').value || null,
                    imagem_principal: document.getElementById('noticia-imagem').value || null,
                    conteudo: document.getElementById('noticia-conteudo').value,
                    meta_descricao: document.getElementById('noticia-meta-descricao').value || null
                };

                if (editingNoticia) {
                    // Atualiza
                    const { error } = await supabaseClient
                        .from('Hsmartins_Noticias')
                        .update(noticiaData)
                        .eq('id', editingNoticia.id);

                    if (error) throw error;
                } else {
                    // Cria novo
                    const { error } = await supabaseClient
                        .from('Hsmartins_Noticias')
                        .insert([noticiaData]);

                    if (error) throw error;
                }

                closeNoticiaModal();
                await loadNoticias();
                alert('Notícia salva com sucesso!');
            } catch (error) {
                console.error('Erro ao salvar notícia:', error);
                alert('Erro ao salvar notícia: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-save mr-2"></i> Salvar Notícia';
            }
        }

        // Edita notícia por ID
        async function editNoticiaById(id) {
            const noticia = noticias.find(n => n.id === id);
            if (noticia) {
                openNoticiaModal(noticia);
            }
        }

        // Edita notícia (função auxiliar)
        function editNoticia(noticia) {
            openNoticiaModal(noticia);
        }

        // Deleta notícia
        async function deleteNoticia(id) {
            if (!confirm('Tem certeza que deseja excluir esta notícia?')) return;

            try {
                const { error } = await supabaseClient
                    .from('Hsmartins_Noticias')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                await loadNoticias();
                alert('Notícia excluída com sucesso!');
            } catch (error) {
                console.error('Erro ao deletar notícia:', error);
                alert('Erro ao excluir notícia: ' + error.message);
            }
        }

        // Inicializa
        initSupabase();
        checkAuth();
    </script>
</body>
</html>
