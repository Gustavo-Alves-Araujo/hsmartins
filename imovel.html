    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 200px);
            gap: 8px;
            border-radius: 16px;
            overflow: hidden;
        }
        
        .gallery-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            transition: filter 0.3s;
        }
        
        .gallery-grid img:hover {
            filter: brightness(0.9);
        }
        
        .gallery-grid > div:first-child {
            grid-column: 1 / 3;
            grid-row: 1 / 3;
        }
        
        .sticky-booking {
            position: sticky;
            top: 100px;
        }
        
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
            
            .gallery-grid > div:first-child {
                grid-column: 1;
                grid-row: 1;
            }
        }
        
        .modal-gallery {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            overflow-y: auto;
        }
        
        .modal-gallery.active {
            display: flex;
        }
        
        .image-navigation {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10001;
        }
    </style>
</head>
<body class="bg-white">
    
    <div id="app"></div>

    <!-- Modal de Galeria -->
    <div id="gallery-modal" class="modal-gallery">
        <div class="w-full h-full flex flex-col items-center justify-center p-4">
            <!-- Header do Modal -->
            <div class="w-full max-w-7xl flex justify-between items-center mb-4">
                <div class="text-white">
                    <span id="image-counter" class="text-lg font-semibold"></span>
                </div>
                <button onclick="closeGalleryModal()" class="text-white hover:text-gray-300 transition">
                    <i class="fas fa-times text-3xl"></i>
                </button>
            </div>
            
            <!-- Imagem Principal -->
            <div class="relative w-full max-w-7xl flex items-center justify-center flex-1">
                <button onclick="previousImage()" class="image-navigation left-4 bg-white hover:bg-gray-100 text-gray-900 w-12 h-12 rounded-full flex items-center justify-center shadow-lg transition">
                    <i class="fas fa-chevron-left"></i>
                </button>
                
                <img id="modal-image" class="max-w-full max-h-[80vh] object-contain rounded-lg" src="" alt="">
                
                <button onclick="nextImage()" class="image-navigation right-4 bg-white hover:bg-gray-100 text-gray-900 w-12 h-12 rounded-full flex items-center justify-center shadow-lg transition">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            
            <!-- Thumbnails -->
            <div id="thumbnails" class="w-full max-w-7xl mt-4 overflow-x-auto">
                <div class="flex gap-2 pb-4"></div>
            </div>
        </div>
    </div>

    <script>
        // Configuração Supabase
        const SUPABASE_URL = 'https://vkwczizdjhsejbpaapea.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrd2N6aXpkamhzZWpicGFhcGVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4NDU0MzAsImV4cCI6MjA4MzQyMTQzMH0.qvWHxNAhefq253JaoVYG19izClKgLGc4ZkW5y8ladmM';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentProperty = null;
        let currentImageIndex = 0;
        let allImages = [];

        // Pega ID do imóvel da URL
        function getPropertyId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        // Carrega dados do imóvel
        async function loadProperty() {
            const propertyId = getPropertyId();
            
            if (!propertyId) {
                renderError('Imóvel não encontrado');
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('Hsmartins_Produtos')
                    .select('*')
                    .eq('id', propertyId)
                    .single();

                if (error) throw error;
                
                if (!data) {
                    renderError('Imóvel não encontrado');
                    return;
                }

                currentProperty = data;
                allImages = data.images_urls ? 
                    (Array.isArray(data.images_urls) ? data.images_urls : JSON.parse(data.images_urls)) 
                    : [data.image_url];
                
                renderProperty(data);
            } catch (error) {
                console.error('Erro ao carregar imóvel:', error);
                renderError('Erro ao carregar imóvel');
            }
        }

        // Renderiza a página do imóvel
        function renderProperty(property) {
            const images = property.images_urls ? 
                (Array.isArray(property.images_urls) ? property.images_urls : JSON.parse(property.images_urls)) 
                : [property.image_url];

            document.getElementById('app').innerHTML = `
                <!-- Header -->
                <header id="main-header" class="fixed top-0 left-0 w-full z-[1000] transition-all duration-300 py-4">
                  <div class="container mx-auto px-6">
                    <nav class="flex items-center justify-between bg-white/40 backdrop-blur-md border border-white/20 rounded-3xl px-6 py-3 shadow-sm">
                      <a href="index.html" class="flex items-center gap-3 group transition-transform hover:scale-105">
                        <img src="img/logo.png" alt="Logo HS Martins" class="h-10 w-10 md:h-12 md:w-12 rounded-full object-cover flex-shrink-0">
                        <span class="hidden md:block font-black text-slate-800 tracking-tight">HS Martins</span>
                      </a>

                      <ul class="hidden lg:flex items-center gap-2">
                        <li><a href="index.html#imoveis" class="nav-link px-4 py-2 text-sm font-bold text-slate-700 hover:text-slate-900 transition-all">Venda</a></li>
                        <li><a href="sobre.html" class="nav-link px-4 py-2 text-sm font-bold text-slate-700 hover:text-slate-900 transition-all">Sobre</a></li>
                        <li><a href="correspondente.html" class="nav-link px-4 py-2 text-sm font-bold text-slate-700 hover:text-slate-900 transition-all">Correspondente Caixa</a></li>
                        <li><a href="index.html#contato" class="nav-link px-4 py-2 text-sm font-bold text-slate-700 hover:text-slate-900 transition-all">Contato</a></li>
                      </ul>

                      <a href="https://wa.me/551146382942" target="_blank"
                         class="flex items-center gap-2 px-6 py-2.5 rounded-full text-white text-sm font-bold shadow-lg transition-all hover:scale-105"
                         style="background: linear-gradient(135deg, #005CA9 0%, #003d7a 100%);">
                        <i class="fab fa-whatsapp"></i>
                        <span>Fale Conosco</span>
                      </a>
                    </nav>
                  </div>
                </header>

                <!-- Content -->
                <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 pt-24 md:pt-32">
                    
                    <!-- Título -->
                    <div class="mb-6">
                        <h1 class="text-3xl font-bold text-gray-900 mb-2">${property.title}</h1>
                        <div class="flex items-center gap-4 text-sm">
                            ${property.rating ? `
                                <div class="flex items-center gap-1">
                                    <i class="fas fa-star text-yellow-400"></i>
                                    <span class="font-semibold">${property.rating}</span>
                                </div>
                            ` : ''}
                            ${property.category ? `
                                <span class="text-gray-600">${property.category}</span>
                            ` : ''}
                        </div>
                    </div>

                    <!-- Galeria de Imagens -->
                    <div class="mb-8 relative">
                        <div class="gallery-grid">
                            ${images.slice(0, 5).map((img, index) => `
                                <div onclick="openGalleryModal(${index})" class="relative group">
                                    <img src="${img}" alt="${property.title} - Foto ${index + 1}">
                                    ${index === 4 && images.length > 5 ? `
                                        <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                                            <span class="text-white text-xl font-semibold">
                                                +${images.length - 5} fotos
                                            </span>
                                        </div>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                        
                        <button 
                            onclick="openGalleryModal(0)" 
                            class="absolute bottom-4 right-4 bg-white border border-gray-900 text-gray-900 px-4 py-2 rounded-lg font-semibold hover:bg-gray-50 transition flex items-center gap-2 shadow-lg"
                        >
                            <i class="fas fa-images"></i>
                            Mostrar todas as ${images.length} fotos
                        </button>
                    </div>

                    <!-- Grid Principal -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        
                        <!-- Coluna Esquerda - Informações -->
                        <div class="lg:col-span-2 space-y-8">
                            
                            <!-- Informações Principais -->
                            <div class="border-b pb-8">
                                <div class="flex items-center justify-between mb-4">
                                    <h2 class="text-2xl font-semibold">${property.category || 'Imóvel'}</h2>
                                    ${property.badge_text ? `
                                        <span class="px-4 py-1 rounded-full text-sm font-semibold ${property.badge_style === 'new' ? 'bg-gray-900 text-white' : 'bg-red-500 text-white'}">
                                            ${property.badge_text}
                                        </span>
                                    ` : ''}
                                </div>
                                
                                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-6">
                                    <div class="flex items-center gap-3">
                                        <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center">
                                            <i class="fas fa-home text-gray-700 text-xl"></i>
                                        </div>
                                        <div>
                                            <p class="text-xs text-gray-500">Tipo</p>
                                            <p class="font-semibold text-gray-900">Casa</p>
                                        </div>
                                    </div>
                                    
                                    <div class="flex items-center gap-3">
                                        <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center">
                                            <i class="fas fa-map-marker-alt text-gray-700 text-xl"></i>
                                        </div>
                                        <div>
                                            <p class="text-xs text-gray-500">Localização</p>
                                            <p class="font-semibold text-gray-900">Poá, SP</p>
                                        </div>
                                    </div>
                                    
                                    <div class="flex items-center gap-3">
                                        <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center">
                                            <i class="fas fa-images text-gray-700 text-xl"></i>
                                        </div>
                                        <div>
                                            <p class="text-xs text-gray-500">Fotos</p>
                                            <p class="font-semibold text-gray-900">${images.length}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Descrição -->
                            <div class="border-b pb-8">
                                <h3 class="text-xl font-semibold mb-4">Sobre este imóvel</h3>
                                <p class="text-gray-600 leading-relaxed">
                                    ${property.title} localizado em excelente região. 
                                    Imóvel com acabamento de qualidade, pronto para morar.
                                    ${property.category ? `Categoria: ${property.category}.` : ''}
                                    Entre em contato para mais informações e agendamento de visita.
                                </p>
                            </div>

                            <!-- Características -->
                            ${(() => {
                                const chars = property.caracteristicas ? 
                                    (Array.isArray(property.caracteristicas) ? property.caracteristicas : JSON.parse(property.caracteristicas || '[]')) 
                                    : [];
                                if (chars.length === 0) return '';
                                return `
                                    <div class="border-b pb-8">
                                        <h3 class="text-xl font-semibold mb-4">Características</h3>
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            ${chars.map(char => `
                                                <div class="flex items-center gap-3 p-4 bg-gray-50 rounded-lg">
                                                    <i class="fas fa-check-circle text-green-600 text-xl"></i>
                                                    <span class="text-gray-700">${char}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `;
                            })()}

                            <!-- Localização -->
                            <div>
                                <h3 class="text-xl font-semibold mb-4">Localização</h3>
                                <div class="bg-gray-100 rounded-lg p-8 text-center">
                                    <i class="fas fa-map-marked-alt text-gray-400 text-4xl mb-3"></i>
                                    <p class="text-gray-600">Mapa de localização disponível na visita</p>
                                </div>
                            </div>

                        </div>

                        <!-- Coluna Direita - Formulário de Contato -->
                        <div class="lg:col-span-1">
                            <div class="sticky-booking border rounded-2xl shadow-xl p-6">
                                
                                <!-- Preço -->
                                <div class="mb-6 pb-6 border-b">
                                    <div class="flex items-baseline gap-2">
                                        <span class="text-3xl font-bold text-gray-900">${property.price_current}</span>
                                        ${property.price_original ? `
                                            <span class="text-lg text-gray-400 line-through">${property.price_original}</span>
                                        ` : ''}
                                    </div>
                                    ${property.installments ? `
                                        <p class="text-sm text-green-600 font-medium mt-2">
                                            <i class="fas fa-credit-card"></i> ${property.installments}
                                        </p>
                                    ` : ''}
                                </div>

                                <!-- Formulário -->
                                <form onsubmit="handleContactSubmit(event)" class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                                        <input 
                                            type="text" 
                                            required 
                                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            placeholder="Seu nome"
                                        >
                                    </div>

                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">WhatsApp</label>
                                        <input 
                                            type="tel" 
                                            required 
                                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            placeholder="(11) 99999-9999"
                                        >
                                    </div>

                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                        <input 
                                            type="email" 
                                            required 
                                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            placeholder="seu@email.com"
                                        >
                                    </div>

                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Mensagem</label>
                                        <textarea 
                                            rows="3" 
                                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            placeholder="Gostaria de agendar uma visita..."
                                        ></textarea>
                                    </div>

                                    <button 
                                        type="submit"
                                        class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-4 rounded-lg font-semibold hover:from-blue-700 hover:to-blue-800 transition shadow-lg"
                                    >
                                        <i class="fas fa-paper-plane mr-2"></i>
                                        Entrar em Contato
                                    </button>

                                    <a 
                                        href="https://wa.me/5511999999999?text=Olá! Tenho interesse no imóvel: ${encodeURIComponent(property.title)}"
                                        target="_blank"
                                        class="w-full bg-green-600 text-white py-4 rounded-lg font-semibold hover:bg-green-700 transition flex items-center justify-center gap-2 mt-3"
                                    >
                                        <i class="fab fa-whatsapp text-xl"></i>
                                        Chamar no WhatsApp
                                    </a>
                                </form>

                                <p class="text-xs text-gray-500 text-center mt-4">
                                    <i class="fas fa-shield-alt"></i> Seus dados estão seguros
                                </p>
                            </div>
                        </div>

                    </div>

                    <!-- Imóveis Relacionados -->
                    <div class="mt-16 border-t pt-16">
                        <h2 class="text-2xl font-bold mb-8">Imóveis Relacionados</h2>
                        <div id="related-properties" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <!-- Carregado dinamicamente -->
                        </div>
                    </div>

                </main>

                <!-- Footer -->
                <footer class="bg-gray-900 text-white mt-20 py-12">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                        <h3 class="text-2xl font-bold mb-2">HS Martins Imóveis</h3>
                        <p class="text-gray-400 mb-4">Seu imóvel dos sonhos está aqui</p>
                        <div class="flex justify-center gap-6">
                            <a href="#" class="text-gray-400 hover:text-white transition">
                                <i class="fab fa-facebook text-2xl"></i>
                            </a>
                            <a href="#" class="text-gray-400 hover:text-white transition">
                                <i class="fab fa-instagram text-2xl"></i>
                            </a>
                            <a href="#" class="text-gray-400 hover:text-white transition">
                                <i class="fab fa-whatsapp text-2xl"></i>
                            </a>
                        </div>
                    </div>
                </footer>
            `;

            // Efeito scroll no header
            const headerScroll = () => {
                const header = document.getElementById('main-header');
                if (window.scrollY > 50) {
                    header.style.backgroundColor = 'rgba(255,255,255,0.8)';
                    header.style.boxShadow = '0 10px 30px -10px rgba(0,0,0,0.08)';
                } else {
                    header.style.backgroundColor = 'transparent';
                    header.style.boxShadow = 'none';
                }
            };
            if (!window._headerScrollAttached) {
                window.addEventListener('scroll', headerScroll);
                window._headerScrollAttached = true;
            }

            loadRelatedProperties(property.id);
        }

        // Carrega imóveis relacionados
        async function loadRelatedProperties(currentId) {
            try {
                const { data, error } = await supabaseClient
                    .from('Hsmartins_Produtos')
                    .select('*')
                    .neq('id', currentId)
                    .limit(3);

                if (error) throw error;

                const container = document.getElementById('related-properties');
                if (data && data.length > 0) {
                    container.innerHTML = data.map(property => `
                        <a href="imovel.html?id=${property.id}" class="group">
                            <div class="relative aspect-[4/3] overflow-hidden rounded-xl mb-3">
                                <img src="${property.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${property.title}">
                            </div>
                            <h3 class="font-semibold text-lg mb-1 group-hover:text-blue-600 transition">${property.title}</h3>
                            <p class="text-gray-600 text-sm mb-2">${property.category || ''}</p>
                            <p class="text-xl font-bold text-gray-900">${property.price_current}</p>
                        </a>
                    `).join('');
                }
            } catch (error) {
                console.error('Erro ao carregar relacionados:', error);
            }
        }

        // Renderiza erro
        function renderError(message) {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen flex items-center justify-center">
                    <div class="text-center">
                        <i class="fas fa-exclamation-triangle text-6xl text-gray-400 mb-4"></i>
                        <h1 class="text-2xl font-bold text-gray-900 mb-2">${message}</h1>
                        <a href="index.html" class="text-blue-600 hover:underline">Voltar para home</a>
                    </div>
                </div>
            `;
        }

        // Modal de galeria
        function openGalleryModal(index) {
            currentImageIndex = index;
            const modal = document.getElementById('gallery-modal');
            modal.classList.add('active');
            updateGalleryImage();
        }

        function closeGalleryModal() {
            document.getElementById('gallery-modal').classList.remove('active');
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % allImages.length;
            updateGalleryImage();
        }

        function previousImage() {
            currentImageIndex = (currentImageIndex - 1 + allImages.length) % allImages.length;
            updateGalleryImage();
        }

        function updateGalleryImage() {
            document.getElementById('modal-image').src = allImages[currentImageIndex];
            document.getElementById('image-counter').textContent = `${currentImageIndex + 1} / ${allImages.length}`;
            
            // Atualiza thumbnails
            const thumbnailsContainer = document.querySelector('#thumbnails > div');
            thumbnailsContainer.innerHTML = allImages.map((img, index) => `
                <img 
                    src="${img}" 
                    onclick="currentImageIndex = ${index}; updateGalleryImage();"
                    class="w-20 h-20 object-cover rounded-lg cursor-pointer border-2 ${index === currentImageIndex ? 'border-white' : 'border-transparent'} hover:border-gray-300 transition"
                    alt="Thumbnail ${index + 1}"
                >
            `).join('');
        }

        // Handler de contato
        function handleContactSubmit(event) {
            event.preventDefault();
            alert('Mensagem enviada com sucesso! Entraremos em contato em breve.');
            event.target.reset();
        }

        // Teclas do teclado
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('gallery-modal').classList.contains('active')) return;
            
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') previousImage();
            if (e.key === 'Escape') closeGalleryModal();
        });

        // Inicializa
        loadProperty();
    </script>
</body>
</html>
