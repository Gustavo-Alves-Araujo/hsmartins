  <style>
    /* CSS Variables e Base Styles */
    :root {
      --primary-color: #000000;
      /* Será sobrescrito pelo JS */
      --secondary-color: #000000;
      /* Será sobrescrito pelo JS */
      --font-family: 'sans-serif';
      /* Será sobrescrito pelo JS */
    }

    body {
      font-family: var(--font-family);
      overflow-x: hidden;
    }

    /* Efeito Skeleton Loading */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 4px;
      color: transparent !important;
      user-select: none;
    }

    /* Mantém a altura dos elementos skeleton para não colapsar o layout */
    .skeleton:empty:before {
      content: "\00a0";
    }

    @keyframes loading {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* Animações Decorativas */
    @keyframes blob {
      0% {
        transform: translate(0px, 0px) scale(1);
      }

      33% {
        transform: translate(30px, -50px) scale(1.1);
      }

      66% {
        transform: translate(-20px, 20px) scale(0.9);
      }

      100% {
        transform: translate(0px, 0px) scale(1);
      }
    }

    .animate-blob {
      animation: blob 7s infinite;
    }

    .animation-delay-2000 {
      animation-delay: 2s;
    }

    /* Utilitários Dinâmicos */
    .text-primary {
      color: var(--primary-color);
    }

    .bg-primary {
      background-color: var(--primary-color);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -10px var(--primary-color);
    }

    .border-primary {
      border-color: var(--primary-color);
    }

    .hover-text-primary:hover {
      color: var(--primary-color);
    }

    /* Smooth Scroll */
    html {
      scroll-behavior: smooth;
    }

    /* Custom Gradients */
    .hero-bg {
      background: linear-gradient(135deg, #fff5f7 0%, #ffffff 100%);
    }

    /* Accordion Styles for FAQ */
    details>summary {
      list-style: none;
    }

    details>summary::-webkit-details-marker {
      display: none;
    }

    details[open] summary~* {
      animation: sweep .5s ease-in-out;
    }

    @keyframes sweep {
      0% {
        opacity: 0;
        transform: translateY(-10px)
      }

      100% {
        opacity: 1;
        transform: translateY(0)
      }
    }
  </style>
</head>

    // Função Principal de Renderização
    function initPage() {
      console.log("Inicializando renderização da página...");

      const root = document.documentElement;
      root.style.setProperty('--primary-color', pageData.theme.primaryColor);
      root.style.setProperty('--secondary-color', pageData.theme.secondaryColor);
      root.style.setProperty('--font-family', pageData.theme.fontFamily);

      setTimeout(() => {
        renderContent();
        lucide.createIcons();
      }, 500);
    }

    function renderContent() {
      // --- Navbar ---
      setText('nav-logo', pageData.navbar.logoText);
      setText('nav-cta', pageData.navbar.ctaButton);

      const menuContainer = document.getElementById('nav-menu');
      menuContainer.innerHTML = '';
      pageData.navbar.menuItems.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="#${item.toLowerCase()}" class="text-gray-600 hover:text-primary font-medium transition-colors cursor-pointer">${item}</a>`;
        menuContainer.appendChild(li);
      });

      // --- Hero ---
      setText('hero-badge', pageData.hero.badge);
      const heroTitle = document.getElementById('hero-title');
      if (heroTitle) {
        removeSkeleton(heroTitle);
        heroTitle.innerHTML = pageData.hero.title.replace(
          '{keyword}',
          `<span class="text-primary relative inline-block">
                        ${pageData.hero.keyword}
                        <svg class="absolute w-full h-3 -bottom-1 left-0 text-red-200 -z-10 opacity-60" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M0 5 Q 50 10 100 5" stroke="currentColor" stroke-width="8" fill="none" /></svg>
                    </span>`
        );
      }
      setText('hero-subtitle', pageData.hero.subtitle);
      setText('hero-cta-primary', pageData.hero.primaryCta);
      const ctaSecondary = document.getElementById('hero-cta-secondary');
      removeSkeleton(ctaSecondary);
      ctaSecondary.innerHTML = `<i data-lucide="download" class="w-5 h-5"></i> ${pageData.hero.secondaryCta}`;
      setText('hero-disclaimer', pageData.hero.disclaimer || "");

      // Hero Image
      const heroImg = document.getElementById('hero-image');
      if (heroImg) {
        heroImg.src = pageData.hero.heroImage;
        heroImg.onload = () => {
          document.getElementById('hero-image-skeleton').style.display = 'none';
          heroImg.classList.remove('bg-gray-200');
        };
      }
      setText('float-text', pageData.hero.floatingCard.text);
      setText('float-value', pageData.hero.floatingCard.value);

      // --- Social Proof ---
      setText('social-proof-title', pageData.socialProof.title);
      const logosContainer = document.getElementById('logos-container');
      logosContainer.innerHTML = '';
      pageData.socialProof.logos.forEach(logo => {
        const img = document.createElement('img');
        img.src = logo.src;
        img.alt = logo.name;
        img.className = "h-8 md:h-10 object-contain opacity-70 hover:opacity-100 transition-opacity duration-300";
        logosContainer.appendChild(img);
      });

      // --- About Section (NEW) ---
      setText('about-title', pageData.about.title);
      const aboutDesc = document.getElementById('about-desc');
      if (aboutDesc) {
        removeSkeleton(aboutDesc);
        aboutDesc.innerHTML = pageData.about.description;
      }
      const aboutImg = document.getElementById('about-image');
      if (aboutImg) {
        aboutImg.src = pageData.about.image;
        aboutImg.onload = () => document.getElementById('about-image-skeleton').style.display = 'none';
      }
      const statsContainer = document.getElementById('about-stats');
      statsContainer.innerHTML = '';
      pageData.about.stats.forEach(stat => {
        statsContainer.insertAdjacentHTML('beforeend', `
                    <div class="text-center">
                        <div class="text-3xl font-bold text-primary">${stat.value}</div>
                        <div class="text-sm text-gray-500 uppercase tracking-wide">${stat.label}</div>
                    </div>
                `);
      });

      // --- Features ---
      setText('features-title', pageData.features.sectionTitle);
      setText('features-subtitle', pageData.features.sectionSubtitle);
      const featuresGrid = document.getElementById('features-grid');
      featuresGrid.innerHTML = '';
      pageData.features.cards.forEach(card => {
        const checklistHtml = card.checklist ? card.checklist.map(item =>
          `<li class="flex items-center text-sm text-gray-500 mt-2"><i data-lucide="check" class="w-4 h-4 text-green-500 mr-2"></i> ${item}</li>`
        ).join('') : '';

        featuresGrid.insertAdjacentHTML('beforeend', `
                    <div class="bg-white p-8 rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300 border border-gray-100 flex flex-col h-full group">
                        <div class="w-12 h-12 bg-red-50 rounded-xl flex items-center justify-center text-2xl mb-6 group-hover:scale-110 transition-transform duration-300">${card.icon}</div>
                        <h3 class="text-xl font-bold text-gray-900 mb-3 group-hover:text-primary transition-colors">${card.title}</h3>
                        <p class="text-gray-600 mb-6 flex-grow leading-relaxed">${card.description}</p>
                        ${checklistHtml ? `<ul class="border-t border-gray-100 pt-4 mt-auto">${checklistHtml}</ul>` : ''}
                    </div>
                `);
      });

      // --- Pricing (NEW) ---
      setText('pricing-title', pageData.pricing.title);
      setText('pricing-subtitle', pageData.pricing.subtitle);
      const pricingGrid = document.getElementById('pricing-grid');
      pricingGrid.innerHTML = '';
      pageData.pricing.cards.forEach(plan => {
        const isHighlight = plan.highlight;
        pricingGrid.insertAdjacentHTML('beforeend', `
                    <div class="relative p-8 rounded-2xl border ${isHighlight ? 'border-primary bg-gray-900 text-white shadow-2xl scale-105 z-10' : 'border-gray-100 bg-white text-gray-900 shadow-sm'} flex flex-col h-full">
                        ${isHighlight ? '<div class="absolute top-0 right-0 bg-primary text-white text-xs font-bold px-3 py-1 rounded-bl-lg rounded-tr-lg">POPULAR</div>' : ''}
                        <h3 class="text-xl font-bold mb-4">${plan.name}</h3>
                        <div class="text-4xl font-bold mb-6">${plan.price}</div>
                        <ul class="mb-8 space-y-3 flex-grow">
                            ${plan.features.map(f => `<li class="flex items-center text-sm ${isHighlight ? 'text-gray-300' : 'text-gray-600'}"><i data-lucide="check" class="w-4 h-4 mr-2 ${isHighlight ? 'text-primary' : 'text-green-500'}"></i> ${f}</li>`).join('')}
                        </ul>
                        <button class="w-full py-3 rounded-full font-bold transition-transform hover:scale-105 ${isHighlight ? 'bg-primary text-white' : 'bg-gray-100 text-gray-900 hover:bg-gray-200'}">Escolher</button>
                    </div>
                `);
      });

      // --- Testimonials ---
      setText('testimonial-title', pageData.testimonials.title);
      const testimonialContainer = document.getElementById('testimonial-container');
      testimonialContainer.innerHTML = '';
      pageData.testimonials.reviews.forEach(review => {
        testimonialContainer.insertAdjacentHTML('beforeend', `
                    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-50 flex flex-col gap-4 hover:border-primary/20 transition-colors">
                        <div class="flex items-center gap-4">
                            <img src="${review.image}" alt="${review.name}" class="w-12 h-12 rounded-full object-cover">
                            <div>
                                <h4 class="font-bold text-gray-900">${review.name}</h4>
                                <p class="text-xs text-gray-500 uppercase">${review.role}</p>
                            </div>
                        </div>
                        <p class="text-gray-700 italic leading-relaxed">"${review.quote}"</p>
                    </div>
                `);
      });

      // --- FAQ (NEW) ---
      setText('faq-title', pageData.faq.title);
      const faqContainer = document.getElementById('faq-container');
      faqContainer.innerHTML = '';
      pageData.faq.questions.forEach(item => {
        faqContainer.insertAdjacentHTML('beforeend', `
                    <details class="group bg-gray-50 rounded-xl overflow-hidden cursor-pointer border border-transparent hover:border-gray-200 transition-all">
                        <summary class="flex justify-between items-center p-6 font-semibold text-gray-900">
                            ${item.q}
                            <span class="transition-transform group-open:rotate-180">
                                <i data-lucide="chevron-down" class="w-5 h-5 text-gray-400"></i>
                            </span>
                        </summary>
                        <div class="px-6 pb-6 text-gray-600 leading-relaxed">
                            ${item.a}
                        </div>
                    </details>
                `);
      });

      // --- Footer ---
      setText('footer-headline', pageData.footer.headline);
      setText('footer-subheadline', pageData.footer.subheadline);
      setText('footer-cta', pageData.footer.buttonText);
      setText('footer-copyright', pageData.footer.copyright);
    }

    function setText(id, text) {
      const el = document.getElementById(id);
      if (el) {
        removeSkeleton(el);
        el.innerText = text;
      }
    }

    function removeSkeleton(el) {
      el.classList.remove('skeleton', 'w-20', 'w-48', 'h-4', 'h-8', 'min-h-[120px]', 'min-h-[80px]', 'min-h-[30px]');
    }

    document.addEventListener('DOMContentLoaded', initPage);

  </script>
</body>

</html>
