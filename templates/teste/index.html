<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title"></title>

  <script src="config.js"></script>

  <script src="../flor-da-tiburcio/components/hero.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: config.theme.colors.primary,
              light: config.theme.colors.primaryLight,
              cream: config.theme.colors.background,
              gold: config.theme.colors.accent
            }
          },
          fontFamily: {
            serif: [config.theme.fonts.primary.replace(/"/g, '\\"')],
            sans: [config.theme.fonts.secondary.replace(/"/g, '\\"')],
          }
        }
      }
    }
  </script>
</head>

<body id="app-body" class="">
  <div id="hero-component"></div>

  <script>
    HeroComponent.createFromConfig(config, 'hero-component');
  </script>
</body>

</html>
