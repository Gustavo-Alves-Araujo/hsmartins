<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title"></title>

  <script src="config.js"></script>

  <script src="../flor-da-tiburcio/components/hero.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: config.theme.colors.primary,
              light: config.theme.colors.primaryLight,
              cream: config.theme.colors.background,
              gold: config.theme.colors.accent
            }
          },
          fontFamily: {
            serif: [config.theme.fonts.primary.replace(/"/g, '\\"')],
            sans: [config.theme.fonts.secondary.replace(/"/g, '\\"')],
          }
        }
      }
    }
  </script>
</head>

<body id="app-body" class="bg-brand-cream text-gray-800 font-sans antialiased overflow-x-hidden">
  <script>
    AOS.init({
      duration: config.theme.animations.aos.duration,
      once: config.theme.animations.aos.once,
      offset: config.theme.animations.aos.offset
    });

    document.addEventListener('DOMContentLoaded', function () {
      HeroComponent.createFromConfig(config, 'hero-component');

      const servicesGrid = document.getElementById('app-body');
      config.services.items.forEach((service, index) => {
        const serviceDiv = document.createElement('div');
        serviceDiv.setAttribute('data-aos', 'fade-up');
        servicesGrid.appendChild(serviceDiv);
      });
    });
  </script>

  <div id="hero-component">
  </div>

</body>

</html>
