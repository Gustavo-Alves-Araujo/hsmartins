<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title"></title>

  <script src="config.js"></script>

  <script src="../flor-da-tiburcio/components/hero.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: config.theme.colors.primary,
              light: config.theme.colors.primaryLight,
              cream: config.theme.colors.background,
              gold: config.theme.colors.accent
            }
          },
          fontFamily: {
            serif: [config.theme.fonts.primary.replace(/"/g, '\\"')],
            sans: [config.theme.fonts.secondary.replace(/"/g, '\\"')],
          }
        }
      }
    }
  </script>
</head>

<body id="app-body" class="bg-brand-cream text-gray-800 font-sans antialiased overflow-x-hidden">
  <div id="hero-component"></div>

  <section id="services" class="py-24 bg-brand-cream">
    <div class="container mx-auto px-6">
      <div class="text-center mb-16" data-aos="fade-up">
        <h2 id="services-title" class="font-serif text-4xl text-brand-dark mb-4"></h2>
        <div class="w-24 h-1 bg-brand-dark mx-auto opacity-20"></div>
      </div>

      <div id="services-grid" class="grid md:grid-cols-3 gap-8">
      </div>
    </div>
  </section>


  <script>
    AOS.init({
      duration: config.theme.animations.aos.duration,
      once: config.theme.animations.aos.once,
      offset: config.theme.animations.aos.offset
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      HeroComponent.createFromConfig(config, 'hero-component');

      const servicesGrid = document.getElementById('services-grid');
      config.services.items.forEach((service, index) => {
        const serviceDiv = document.createElement('div');
        serviceDiv.className = 'group relative overflow-hidden rounded-2xl aspect-[4/5] cursor-pointer';
        serviceDiv.setAttribute('data-aos', 'fade-up');
        serviceDiv.setAttribute('data-aos-delay', index * 100);
        serviceDiv.innerHTML = `
                    <img src="${service.image}" alt="${service.alt}" class="w-full h-full object-cover img-zoom">
                    <div class="absolute inset-0 bg-gradient-to-t from-brand-dark/90 to-transparent flex flex-col justify-end p-8">
                        <div class="transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300">
                            <h3 class="text-2xl font-serif text-white mb-2">${service.name}</h3>
                            <p class="text-white/80 text-sm opacity-0 group-hover:opacity-100 transition-opacity duration-300 delay-100">
                                ${service.description}
                            </p>
                        </div>
                    </div>
                `;
        servicesGrid.appendChild(serviceDiv);
      });
    });
  </script>
</body>

</html>
